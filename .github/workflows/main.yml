name: gitclone&maven
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
env:
  ENVIRONMENT: production
jobs:
  maven-build:
    name: clone the repo and build using maven
    runs-on: ubuntu-latest
    steps:
      - name: checkout the source-code
        uses: actions/checkout@v4
        
      - name: setup-java-17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Check Java Version
        run: java -version
          
        
        
      
